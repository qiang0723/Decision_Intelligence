# 决策智能架构 · 研究站 —— 本地静态服务
# 目标：中文正确显示、Markdown 源码可直接在浏览器阅读、无缓存干扰编辑

server {
    listen       80;
    server_name  localhost;

    # 中文站点必须显式声明，否则部分环境下 nginx 不发 charset
    charset utf-8;
    charset_types text/html text/css text/plain application/javascript;

    # Markdown 默认会被当成二进制下载，这里让它在浏览器里直接以纯文本显示
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        text/plain                            md txt;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
        application/json                      json;
    }
    default_type text/plain;

    gzip on;
    gzip_types text/html text/css application/javascript text/plain application/json;
    gzip_min_length 1024;

    # 本地开发：不缓存，改完刷新即可见
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff";

    # ---------- 站点（展示层）----------
    root  /srv/site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---------- 内容库（Markdown 真身，可直接阅读）----------
    location /content/ {
        alias /srv/content/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }

    # ---------- 文档（信息架构 · 路线图 · 评审报告 · 修订记录）----------
    location /docs/ {
        alias /srv/docs/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }

    location = /README.md {
        alias /srv/README.md;
        charset utf-8;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        return 404 "404 - 页面不存在。站点入口：/index.html\n";
    }
}
